<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lernreich — Redesign</title>
<link rel="stylesheet" href="redesign-styles.css" />
<link rel="stylesheet" href="views.css" />
</head>
<body>
<div id="stage">
  <div class="win" id="win">
    <div class="titlebar">
      <div class="tl-dots"><span class="tl-dot r"></span><span class="tl-dot y"></span><span class="tl-dot g"></span></div>
      <div class="tb-title">Lernreich — Focus Timer</div>
    </div>
    <div id="root" style="flex:1 1 auto; min-height:0; display:flex;"></div>
  </div>
</div>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="20" fill="#1c2a4a"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="#4659e6" stroke-width="6" stroke-linecap="round" stroke-dasharray="140 60" transform="rotate(-90 50 50)"/>
    <text x="50" y="58" font-family="monospace" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">L</text>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="TimerView.jsx"></script>
<script type="text/babel" src="StatsView.jsx"></script>
<script type="text/babel" src="CalendarView.jsx"></script>
<script type="text/babel" src="JournalView.jsx"></script>
<script type="text/babel" src="App.jsx"></script>

<script>
  function fitWindow() {
    const win = document.getElementById('win');
    const pad = 32;
    const s = Math.min(1, (window.innerWidth - pad) / 1080, (window.innerHeight - pad) / 720);
    win.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitWindow);
  fitWindow();
</script>
</body>
